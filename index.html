<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>CineRate</title>
     <link rel="stylesheet" href="./style.css">
     <script src="./main.js" type="module" defer></script>
</head>
<body>
     <header>
          <h1>CineRate</h1>
          <search>
               <form>
                    <input id="searchBar" name="search" placeholder="search">
               </form>
          </search>
     </header>

     <div id="movie-view">
          <div class="popularContainer">
               <h2>10 Popular movies</h2>
          </div>

          <div class="topTenContainer">
               <h2>Top 10 movies</h2>
          </div>
     </div>

     <div id="person-view">
          <h2>10 Popular persons</h2>
          <div class="person-container">
          </div>
     </div>

     <div id="search-view">
          <div class="dropdown">
               <button class="dropdown-btn">Choose genre</button>
               <div class="dropdown-content"></div>
          </div>
          <div class="search-content"></div>
     </div>

     <div class="no-show" id="detail-view"></div>
</body>
</html>
